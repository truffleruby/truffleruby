name: 'Install JVMCI and clone Graal'
runs:
  using: "composite"
  steps:
    - name: Clone Graal
      run: jt sforceimports
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Install JVMCI
      run: jt install jvmci
      shell: bash
      working-directory: ${{ github.action_path }}
